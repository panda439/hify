[project]
name = "hify-bge-reranker-sidecar"
version = "0.1.0"
description = "Local BGE reranker sidecar for the Hify MIRACL benchmark"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sentence-transformers==3.3.1",
  "transformers==4.48.3",
  "torch==2.6.0",
  "psutil==6.1.1",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["test_app.py"]
