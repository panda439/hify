# Hify eval harness 的固定测试集——`make eval` 会依次跑这里的每个 case。
# agent_id 必须是已经通过 UI/API 配置好的、真实存在的 agent（自带 model/
# 知识库/工具组合），eval harness 不单独发明一套 agent 配置格式。
#
# 用法见 README 或 `go run ./cmd/evalrunner -h`：
#   go run ./cmd/evalrunner --judge-model-id <UUID> --user-id <UUID>
#
# 下面是本地 Hify 学习环境的首套真实 RAG baseline 用例；如果数据库重建，
# 需要用新环境里的专用 Eval Agent/document id 同步替换这些标识。
#
# RAG Eval V1 新增字段（全部可选，见 internal/eval/model.go 的 TestCase 注释）：
#   expected_document_ids: 一组"命中其中任意一个就算对"的可接受文档 id 集合，
#     数组顺序不影响任何指标——Hit/ExpectedDocumentCited 只要命中集合里任意
#     一个即为 true；MRR 取"排名最靠前（rank 最小）的那次命中"算 1/rank，
#     和这些 id 在数组里写的先后顺序无关。不配置则跳过 Hit/MRR/RecallAt1/
#     RecallAt3/ExpectedDocumentCited 这几个确定性指标（Metrics 里显示
#     evaluated=false）。
#   require_citation: true 表示最终回复必须至少带一条结构化引用。
#   expected_facts / forbidden_facts: 交给 LLM Judge 做语义核对的事实点列表，
#     不是关键词匹配。
#   turns: 多轮 case 专用（阶段一新增），一个 case 配置 turns 时会在同一个
#     conversation 里按顺序依次发送这些 prompt，只有最后一轮的回复/检索/引用
#     参与打分和指标计算，前面几轮只用来构造对话历史——测的是"后一轮用代词/
#     省略指代前一轮"时，检索和回复能不能结合上下文。配置了 turns 就不要再配
#     置 prompt（prompt 会被忽略）。
#
# 阶段一测试集类别覆盖（每类至少一条，括号内是对应 case 的 name）：
#   普通语义查询           immutable_knowledge_config / supported_file_formats
#   同义词查询             login_rate_limit（"连续登录失败很多次" vs 原文"账号
#                          被锁定"）/ synonym_model_unavailable（"灰的选不
#                          中" vs 原文"选不了"）
#   精确关键词/报错原文     exact_error_message_billing（用户直接粘贴系统里
#                          看到的报错原文"供应商账户余额不足"）
#   多轮指代问题           multi_turn_coreference_chunk_size
#   知识库没有答案         no_answer_in_knowledge_base
#   多文档内容相似         similar_docs_temp_password_cannot_skip（同一件事
#                          在两篇文档里都提到）/ forgot_password（同样跨两篇
#                          文档）
#   必须引用的问题         除 no_answer_in_knowledge_base 外全部 case 都配置
#                          了 require_citation: true
#
# 注意：这个测试集目前完全没有覆盖"知识库里确实没有相关内容但用户问题本身
# 涉及错误码/接口名/字段名"这一子类（比如问某个具体 HTTP 状态码或 JSON 字段
# 含义）——本地这两篇 FAQ 源文档里没有任何这类内容可供设计有依据的 case，
# 强行编一个不存在于文档里的错误码会变成编造 expected_facts，所以没有加。
# 如果后续知识库里补充了包含错误码/接口字段说明的文档，应在这里补一条。
cases:
  - name: "forgot_password"
    agent_id: "019f9d3a-a045-719a-ae79-270a0bbbd739"
    prompt: "我忘记 Hify 的登录密码了，可以自己找回吗？"
    rubric: "必须准确说明当前不能自助找回，并给出联系管理员重置临时密码的处理方式"
    expected_document_ids:
      - "019f5f88-eaf7-722e-84ec-48e1e6dea400"
      - "019f5f9c-c256-75e7-91e2-e3a00fac9fea"
    require_citation: true
    expected_facts:
      - "Hify 目前不支持用户自助找回密码"
      - "需要联系管理员重置临时密码"
      - "首次使用临时密码登录后必须立即修改密码"
    forbidden_facts:
      - "可以通过忘记密码邮件自行重置"

  - name: "login_rate_limit"
    agent_id: "019f9d3a-a045-719a-ae79-270a0bbbd739"
    prompt: "我连续登录失败很多次，现在应该怎么办？"
    rubric: "必须说明登录限流阈值、等待窗口以及账号禁用这一备选排查方向"
    expected_document_ids:
      - "019f5f9c-c256-75e7-91e2-e3a00fac9fea"
    require_citation: true
    expected_facts:
      - "15 分钟内连续登录失败 10 次会被临时限流"
      - "等待窗口期结束后可以重试"
      - "密码无误仍无法登录时应联系管理员确认账号是否被禁用"
    forbidden_facts:
      - "必须立即联系管理员解除登录限流"

  - name: "supported_file_formats"
    agent_id: "019f9d3a-a045-719a-ae79-270a0bbbd739"
    prompt: "知识库可以上传哪些文件，单个文件最大多大？"
    rubric: "必须完整列出支持格式并准确说明单文件大小限制"
    expected_document_ids:
      - "019f5f9c-c256-75e7-91e2-e3a00fac9fea"
    require_citation: true
    expected_facts:
      - "支持 txt、markdown、pdf"
      - "单个文件不超过 10MB"
    forbidden_facts:
      - "支持 Word 或 Excel"

  - name: "immutable_knowledge_config"
    agent_id: "019f9d3a-a045-719a-ae79-270a0bbbd739"
    prompt: "知识库创建以后还能修改向量模型、分块大小和重叠参数吗？"
    rubric: "必须明确说明三个参数均不可修改，并解释兼容性原因和替代方案"
    expected_document_ids:
      - "019f5f9c-c256-75e7-91e2-e3a00fac9fea"
    require_citation: true
    expected_facts:
      - "向量模型、分块大小、分块重叠在知识库创建后不可修改"
      - "修改会导致新旧数据不兼容"
      - "需要更换模型时应新建知识库并重新上传文档"
    forbidden_facts:
      - "可以直接修改并自动兼容历史分片"

  - name: "conversation_privacy"
    agent_id: "019f9d3a-a045-719a-ae79-270a0bbbd739"
    prompt: "管理员能通过接口查看我的对话记录吗？"
    rubric: "必须准确说明对话私有且管理员也不能通过接口直接查看"
    expected_document_ids:
      - "019f5f9c-c256-75e7-91e2-e3a00fac9fea"
    require_citation: true
    expected_facts:
      - "对话记录只有用户自己能看到"
      - "管理员也无法通过接口直接查看别人的对话内容"
    forbidden_facts:
      - "管理员可以随时查看所有用户的对话内容"

  # --- 以下 5 条是阶段一为补齐 8 类测试场景覆盖新增的 case，同样绑定同一个本地
  # 学习环境的真实 agent_id/document_id（customer_service_faq.txt =
  # 019f5f9c-c256-75e7-91e2-e3a00fac9fea，hify_test_doc.txt =
  # 019f5f88-eaf7-722e-84ec-48e1e6dea400），内容均可在
  # data/knowledge/019f5f88-ba7e-7b94-8d04-48e4acaddc40/ 下的源文件里核对，
  # 不是编造的 expected_facts。数据库/环境重建后同样需要用新环境的真实 id 替换。

  # 类别：精确关键词 / 报错原文（用户直接粘贴系统里看到的错误提示原文，考察
  # 检索能否命中精确匹配的表述，而不是靠语义泛化）
  - name: "exact_error_message_billing"
    agent_id: "019f9d3a-a045-719a-ae79-270a0bbbd739"
    prompt: "对话的时候页面提示「供应商账户余额不足」，这是什么意思，要怎么处理？"
    rubric: "必须准确说明这是模型供应商账户余额不足，需要管理员去供应商官网充值，并且这和 Hify 本身无关"
    expected_document_ids:
      - "019f5f9c-c256-75e7-91e2-e3a00fac9fea"
    require_citation: true
    expected_facts:
      - "说明当前 Agent 使用的模型供应商账户余额不够"
      - "需要管理员去对应供应商官网充值"
      - "这和 Hify 平台本身无关，Hify 只是转发请求"
    forbidden_facts:
      - "是 Hify 自身账户余额不足，需要给 Hify 充值"

  # 类别：同义词查询（不使用文档原文措辞，考察语义检索是否还能命中同一条
  # FAQ——原文是"为什么有的模型选不了"，这里换成"灰掉/下拉框里没有"）
  - name: "synonym_model_unavailable"
    agent_id: "019f9d3a-a045-719a-ae79-270a0bbbd739"
    prompt: "创建 Agent 的时候，为什么有些模型在下拉框里是灰的选不中？"
    rubric: "必须说明 Agent 只能挂载对话类模型、知识库只能挂载向量类模型两者不能混用，并提示检查模型的能力类型和启用状态"
    expected_document_ids:
      - "019f5f9c-c256-75e7-91e2-e3a00fac9fea"
    require_citation: true
    expected_facts:
      - "Agent 只能挂载「对话」类型的模型"
      - "知识库只能挂载「向量」类型的模型，两者不能混用"
      - "需要检查模型的能力类型配置和是否处于启用状态"
    forbidden_facts:
      - "任意类型的模型都可以挂载给 Agent 使用"

  # 类别：知识库没有答案（问的内容在这个知识库的两篇文档里都没有提到，考察
  # 模型是否会老实说不知道，而不是编造一个听起来合理的答案）
  - name: "no_answer_in_knowledge_base"
    agent_id: "019f9d3a-a045-719a-ae79-270a0bbbd739"
    prompt: "Hify 支持对接钉钉或飞书机器人，把回复自动同步过去吗？"
    rubric: "知识库里没有任何关于钉钉/飞书对接的内容，回复必须诚实说明当前资料里没有查到相关说明，不能编造 Hify 支持或不支持这类对接的具体细节"
    forbidden_facts:
      - "Hify 支持对接钉钉机器人"
      - "Hify 支持对接飞书机器人"
      - "给出了钉钉或飞书对接的具体配置步骤"

  # 类别：多文档内容相似（hify_test_doc.txt 和 customer_service_faq.txt 都
  # 讲了"临时密码登录后必须改密码"这件事，考察多篇相似文档同时命中时模型能
  # 不能正确整合而不是互相矛盾或者只用了其中一篇）
  - name: "similar_docs_temp_password_cannot_skip"
    agent_id: "019f9d3a-a045-719a-ae79-270a0bbbd739"
    prompt: "用管理员给的临时密码登录以后，可以先跳过改密码，晚点再改吗？"
    rubric: "必须明确说明不允许跳过，首次用临时密码登录后系统会强制要求立即修改密码"
    expected_document_ids:
      - "019f5f88-eaf7-722e-84ec-48e1e6dea400"
      - "019f5f9c-c256-75e7-91e2-e3a00fac9fea"
    require_citation: true
    expected_facts:
      - "首次使用临时密码登录后，系统强制要求立即修改密码，不允许跳过"
    forbidden_facts:
      - "可以选择跳过修改密码，之后再改"

  # 类别：多轮指代问题（第二轮用"那...呢"指代第一轮问过的"知识库创建后参数
  # 能否修改"这个语境，不重复说出"知识库参数不可修改"这个前提，考察检索/回复
  # 是否结合了对话历史）
  - name: "multi_turn_coreference_chunk_size"
    agent_id: "019f9d3a-a045-719a-ae79-270a0bbbd739"
    turns:
      - "知识库创建以后还能修改用的向量模型吗？"
      - "那分块大小呢，也不能改吗？"
    rubric: "第二轮回复必须结合第一轮的语境（知识库参数不可修改），明确说明分块大小同样在知识库创建后不可修改"
    expected_document_ids:
      - "019f5f9c-c256-75e7-91e2-e3a00fac9fea"
    require_citation: true
    expected_facts:
      - "分块大小在知识库创建后同样不可修改"
    forbidden_facts:
      - "分块大小可以随时修改，和向量模型不一样"

  # ===== 001-rag-query-rerank T038：查询优化/重排的"硬"多轮用例 =====
  #
  # 为什么要单独加这一组：既有的 multi_turn_coreference_chunk_size 在查询改写
  # 关闭的状态下就已经 RetrievalHit=true、MRR=1.00、评分 5——它的第二轮
  # "那分块大小呢" 里带着"分块大小"这个实词，关键词路直接就能打中原文，
  # 所以它测不出查询改写有没有价值（顶格的指标没有上升空间）。
  #
  # 下面这几条的设计约束：**最后一轮不能包含任何在目标文档里出现过的实词**，
  # 只留指代和省略，逼检索必须依赖上文补全。所有 expected_facts 都逐字对应
  # 知识库里两篇真实文档的原文，没有编造。
  #
  # 注意：这几条在改写关闭时预期会失败或降级，这是**设计意图**，不是坏用例——
  # 它们存在的目的就是让 SC-001/SC-002 的提升幅度可被度量。

  # 目标原文："目前支持 txt、markdown、pdf 三种格式，单个文件不超过 10MB。"
  # 末轮"那大小有限制吗"里没有"文件/上传/格式/MB"任何一个实词，而"大小"这个
  # 词在文档里只出现在"分块大小"（另一个话题）——关键词路会被带偏到错误的
  # 片段上，正是这条用例要暴露的失败模式。
  - name: "hard_multi_turn_ellipsis_upload_size_limit"
    agent_id: "019f9d3a-a045-719a-ae79-270a0bbbd739"
    turns:
      - "知识库能传哪些类型的文件？"
      - "那大小有限制吗？"
    rubric: "第二轮必须结合第一轮语境理解为在问上传文件的大小限制，并准确给出单个文件的大小上限；不得把问题理解成分块大小"
    expected_document_ids:
      - "019f5f9c-c256-75e7-91e2-e3a00fac9fea"
    require_citation: true
    expected_facts:
      - "单个文件不超过 10MB"
    forbidden_facts:
      - "单个文件没有大小限制"
      - "回答的是分块大小而不是上传文件大小"

  # 目标原文："知识库创建后，向量模型、分块大小、分块重叠这三个参数是锁定的"
  # 末轮"除了它还有别的一起被固定住的吗"完全没有"分块/重叠/参数/锁定"这些实词。
  - name: "hard_multi_turn_ellipsis_locked_params"
    agent_id: "019f9d3a-a045-719a-ae79-270a0bbbd739"
    turns:
      - "知识库建好之后，向量模型还能换吗？"
      - "除了它，还有别的一起被固定住的吗？"
    rubric: "第二轮必须结合第一轮语境理解为在问知识库创建后还有哪些参数同样不可修改，并列出分块大小与分块重叠"
    expected_document_ids:
      - "019f5f9c-c256-75e7-91e2-e3a00fac9fea"
    require_citation: true
    expected_facts:
      - "分块大小在知识库创建后同样不可修改"
      - "分块重叠在知识库创建后同样不可修改"
    forbidden_facts:
      - "除了向量模型以外其他参数都可以随时修改"

  # 目标原文："连续登录失败达到限流阈值（15 分钟内 10 次）会被临时限流，
  # 等待窗口期结束后即可重试"。末轮"多久能好"是口语，与原文零词面重叠——
  # 同义/口语 + 省略指代叠加，是最难的一类。
  - name: "hard_multi_turn_colloquial_ellipsis_rate_limit"
    agent_id: "019f9d3a-a045-719a-ae79-270a0bbbd739"
    turns:
      - "密码输错好几次进不去了，是不是被封了？"
      - "多久能好？"
    rubric: "第二轮必须结合第一轮语境理解为在问登录限流的解除时间，并准确给出限流窗口；不得回答成账号被永久禁用"
    expected_document_ids:
      - "019f5f9c-c256-75e7-91e2-e3a00fac9fea"
    require_citation: true
    expected_facts:
      - "连续登录失败达到阈值会被临时限流"
      - "等待窗口期结束后即可重试"
    forbidden_facts:
      - "需要联系管理员才能解除登录限流"

  # FR-003 的守门用例：末轮的"它"在上文里有两个同样合理的指代对象（Agent 的
  # 模型 / 知识库的模型），改写**不允许**猜其中之一。这条不考察检索命中，
  # 只考察"不编造"——所以不配 expected_document_ids，避免用一个本就不该确定的
  # 目标去打确定性指标。
  - name: "ambiguous_reference_must_not_guess"
    agent_id: "019f9d3a-a045-719a-ae79-270a0bbbd739"
    turns:
      - "Agent 和知识库分别要挂什么类型的模型？"
      - "它建好之后还能换吗？"
    rubric: "末轮的『它』在上文中有 Agent 与知识库两个同样合理的指代对象。回复不得臆断为其中之一并给出确定答案——可以分别说明两种情况，或请用户澄清指的是哪一个；把知识库参数锁定的结论直接套到 Agent 上属于严重错误"
    require_citation: true
    expected_facts:
      - "没有把『它』武断地判定成 Agent 或知识库中的某一个"
    forbidden_facts:
      - "直接断言 Agent 建好之后模型不能更换"
